<script>
"use strict";
/* Everything here sits inside one function on purpose: the page written over
   this one runs in the same window, and a name declared at the top level here
   would clash with one of its own. */
(function(){
  var ROOT=document.documentElement, KEY="aidp.lock";
  var LOCK=JSON.parse(document.getElementById("aidp-lock").textContent);
  var f=document.getElementById("lk-f"), i=document.getElementById("lk-i"),
      b=document.getElementById("lk-b"), m=document.getElementById("lk-m"),
      card=document.getElementById("lk-card");
  var subtle=window.crypto && window.crypto.subtle;

  function say(en, zh){
    m.innerHTML=en ? '<span class="wk-en">'+en+'</span><span class="wk-zh">'+zh+'</span>' : "";
  }
  function bytes(s){
    if(Uint8Array.fromBase64) return Uint8Array.fromBase64(s);
    var bin=atob(s), out=new Uint8Array(bin.length);
    for(var k=0;k<bin.length;k++) out[k]=bin.charCodeAt(k);
    return out;
  }
  function text(raw){
    var s="";
    for(var k=0;k<raw.length;k++) s+=String.fromCharCode(raw[k]);
    return btoa(s);
  }
  function derive(pw){
    var enc=new TextEncoder().encode(pw.trim().normalize("NFC"));
    return subtle.importKey("raw", enc, "PBKDF2", false, ["deriveBits"]).then(function(base){
      return subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:bytes(LOCK.salt), iterations:LOCK.rounds}, base, 256);
    }).then(function(bits){ return new Uint8Array(bits); });
  }
  function unlock(raw){
    return subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]).then(function(key){
      return subtle.decrypt({name:"AES-GCM", iv:bytes(LOCK.iv)}, key, bytes(LOCK.data));
    }).then(function(packed){
      var gunzip=new DecompressionStream("gzip");
      return new Response(new Blob([packed]).stream().pipeThrough(gunzip)).text();
    });
  }
  function show(html){
    var hash=location.hash;
    document.open();
    document.write(html);
    document.close();
    if(hash.length>1){
      window.setTimeout(function(){
        var id; try{ id=decodeURIComponent(hash.slice(1)); }catch(e){ id=hash.slice(1); }
        var el=document.getElementById(id);
        if(el) el.scrollIntoView();
      }, 0);
    }
  }
  function lang(v){
    ROOT.setAttribute("data-lang", v);
    ROOT.setAttribute("lang", v==="zh" ? "zh-Hans" : "en");
    try{ localStorage.setItem("aidp.lang", v); }catch(e){}
    paint();
  }
  function paint(){
    var v=ROOT.getAttribute("data-lang")==="zh" ? "zh" : "en";
    document.querySelectorAll(".lk-lang button").forEach(function(x){
      x.setAttribute("aria-pressed", x.getAttribute("data-v")===v ? "true" : "false");
    });
  }
  function ready(){
    ROOT.className="";
    i.focus();
  }

  paint();
  document.querySelector(".lk-lang").addEventListener("click", function(e){
    var x=e.target.closest("button");
    if(x) lang(x.getAttribute("data-v"));
  });

  if(!subtle || !window.DecompressionStream || !window.TextEncoder){
    ROOT.className="";
    f.hidden=true;
    say("This browser cannot open the page. Open it in a current Edge, Chrome, Firefox or Safari.",
        "此浏览器打不开本页，请改用新版 Edge、Chrome、Firefox 或 Safari。");
    return;
  }

  var saved=null;
  try{ saved=sessionStorage.getItem(KEY); }catch(e){}
  if(saved){
    unlock(bytes(saved)).then(show, function(){
      try{ sessionStorage.removeItem(KEY); }catch(e){}
      ready();
    });
  }else{
    ready();
  }

  f.addEventListener("submit", function(ev){
    ev.preventDefault();
    if(!i.value.trim()) return;
    say("Checking…", "正在核对…");
    i.disabled=b.disabled=true;
    derive(i.value).then(function(raw){
      return unlock(raw).then(function(html){
        try{ sessionStorage.setItem(KEY, text(raw)); }catch(e){}
        show(html);
      });
    }).catch(function(){
      i.disabled=b.disabled=false;
      say("That is not the password.", "密码不对。");
      i.value=""; i.focus();
      card.classList.remove("no"); void card.offsetWidth; card.classList.add("no");
    });
  });
})();
</script>
